server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;

    location /toadies/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
